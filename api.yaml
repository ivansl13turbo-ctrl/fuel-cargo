          items:
            $ref: "#/components/schemas/UserRole"
          example: [DRIVER]
        companyId:
          type: string
          example: "company-100"
        isActive:
          type: boolean
          default: true
          example: true

    UpdateUser:
      type: object
      properties:
        isActive:
          type: boolean
          nullable: true
        roles:
          type: array
          nullable: true
          minItems: 1
          items:
            $ref: "#/components/schemas/UserRole"
        companyId:
          type: string
          nullable: true

    User:
      type: object
      required: [userId, roles, companyId, isActive, createdAt, updatedAt]
      properties:
        userId:
          type: string
          example: "user-100"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
          example: [DRIVER]
        companyId:
          type: string
          example: "company-100"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp ms
        updatedAt:
          type: integer
          format: int64
          description: Unix timestamp ms

    UsersResponse:
      type: object
      required: [users, total]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
          example: 1

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
